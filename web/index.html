<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <title>SplitSmart</title>
    <meta name="description" content="Divide gastos entre amigos de forma inteligente" />
    <meta name="theme-color" content="#4B89DC" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SplitSmart" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Manifest PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png" />

    <style>
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #4B89DC;
      }
      /* Ocultar scrollbar en mobile */
      body { overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      // Registrar Service Worker para soporte offline e instalación PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').then(
            function (reg) { console.log('[SW] Registrado:', reg.scope); },
            function (err) { console.warn('[SW] Error al registrar:', err); }
          );
        });
      }
    </script>
  </body>
</html>
